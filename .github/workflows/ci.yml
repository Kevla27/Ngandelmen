name: CI - Smart Meter Firmware & Automated Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Host Automated Unit & Integration Tests (Matrix: TZ & Non-TZ)
  # =========================================================================
  host-automated-tests:
    name: 🧪 Host Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ "Uji_Coba_Integrasi_TZ", "Uji_Coba_Integrasi" ]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Build Tools (CMake, Ninja, GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: ⚙️ Configure CMake for Host Tests
        run: |
          PROJECT_DIR="${{ matrix.project }}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm -rf host_build
          cmake -B host_build -S "$PROJECT_DIR/firmware" -GNinja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: 🔨 Compile Test Executables
        run: |
          cmake --build host_build --parallel

      - name: 🚀 Execute All Tests via CTest
        run: |
          ctest --test-dir host_build --output-on-failure --verbose

      - name: 📊 Summarize Test Results
        if: always()
        run: |
          echo "### 🧪 Ringkasan Pengujian CTest: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "Seluruh suite pengujian host untuk target **${{ matrix.project }}** berhasil dieksekusi." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # JOB 2: STM32U575 ARM Cross-Compilation Build (Matrix: TZ & Non-TZ)
  # =========================================================================
  stm32-firmware-build:
    name: ⚡ STM32 ARM Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [host-automated-tests]
    strategy:
      fail-fast: false
      matrix:
        project: [ "Uji_Coba_Integrasi_TZ", "Uji_Coba_Integrasi" ]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧰 Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: 🛠️ Install Ninja & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: ⚙️ Configure CMake for Target
        run: |
          TARGET_DIR="${{ matrix.project }}"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          cd "$TARGET_DIR"
          rm -rf build Secure/build NonSecure/build
          
          if [ "$TARGET_DIR" = "Uji_Coba_Integrasi_TZ" ]; then
            TOOLCHAIN="$(pwd)/gcc-arm-none-eabi.cmake"
          else
            TOOLCHAIN="$(pwd)/cmake/gcc-arm-none-eabi.cmake"
          fi
          
          cmake -B build/Debug -S . -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Debug

      - name: 🔨 Compile Firmware Target
        run: |
          cd "$TARGET_DIR"
          ninja -C build/Debug

      - name: 📏 Calculate Memory Footprint
        run: |
          cd "$TARGET_DIR"
          echo "### ⚡ Memory Footprint: ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          if [ "$TARGET_DIR" = "Uji_Coba_Integrasi_TZ" ]; then
            echo "Secure World:"
            arm-none-eabi-size Secure/build/*.elf
            echo "Non-Secure World:"
            arm-none-eabi-size NonSecure/build/*.elf
          else
            arm-none-eabi-size build/Debug/*.elf
          fi

      - name: 📦 Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-binaries-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/**/build/**/*.elf
            ${{ matrix.project }}/**/build/**/*.hex
            ${{ matrix.project }}/**/build/**/*.bin
            ${{ matrix.project }}/**/build/**/*.map
          retention-days: 14
